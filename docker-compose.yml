version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SUPABASE_URL: "https://your-supabase-url.supabase.co"
        SUPABASE_KEY: "your-supabase-anon-key"
    container_name: harmony_music_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=https://your-supabase-url.supabase.co
      - SUPABASE_KEY=your-supabase-anon-key
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:15-alpine
    container_name: harmony_music_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: harmony_music_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer:latest
    container_name: harmony_music_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db

volumes:
  postgres_data:
